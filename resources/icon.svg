<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="24" fill="#1e1e1e"/>
  <rect x="10" y="10" width="108" height="108" rx="18" fill="#2d2d2d"/>
  <!-- 鐮刀：扳手走「/」方向，是鎚子鐮刀圖案的左右鏡像，所以握柄放右下、刀身繞左側到上方。
       刀身是兩個偏心圓的差（外圓心 74,54 r40；內圓 r34 往 338° 偏 10），刀尖自然收成一點。
       圓心刻意偏右上：刀身要壓在扳手桿身上、讓環端露在刀身外，置中的話環端會整個蓋住刀身。 -->
  <g fill="#d4d4d4">
    <path d="M82.32 93.13 A40 40 0 1 1 88.23 16.62 A34 34 0 1 0 80.40 84.13 Z"/>
    <path transform="rotate(-12 81.36 88.63)" d="M79.86 81.63 H99.86 a7 7 0 0 1 0 14 H79.86 Z"/>
  </g>
  <!-- 扳手壓在上層：先描一圈底色讓交叉處有縫，再填綠色；開口端在右上 -->
  <g transform="rotate(-45 64 64)">
    <g fill="#2d2d2d" stroke="#2d2d2d" stroke-width="6" stroke-linejoin="round">
      <rect x="24" y="56" width="66" height="16" rx="8"/>
      <circle cx="24" cy="64" r="13"/>
      <path d="M92 71 L116.58 71 A18 18 0 1 1 116.58 57 L92 57 Z"/>
    </g>
    <g fill="#89d185">
      <rect x="24" y="56" width="66" height="16" rx="8"/>
      <circle cx="24" cy="64" r="13"/>
      <path d="M92 71 L116.58 71 A18 18 0 1 1 116.58 57 L92 57 Z"/>
    </g>
    <circle cx="24" cy="64" r="5.5" fill="#2d2d2d"/>
  </g>
</svg>
